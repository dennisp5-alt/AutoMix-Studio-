name: AutoMix Studio v0.2.4 — Stereo Premaster (isolated)

on:
  push:
    branches: [experiment/automix-stereo-premaster-v024]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.2.4 isolated test
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prove existing AutoMix source and configurations unchanged
        run: |
          test -f app/src/main/java/com/dennis/automix/audio/AutoMixEngine.java
          grep -q "public static final int MAX_TRACKS = 12;" app/src/main/java/com/dennis/automix/audio/AutoMixEngine.java
          grep -q "applicationId 'com.dennis.automix.stereopremaster024'" app/build.gradle
          grep -q "versionName '0.2.4-stereo-test'" app/build.gradle
          git diff origin/experiment/automix-intelligent-12stems-v023 --             app/src/main/java/com/dennis/automix/audio/AutoMixEngine.java             app/src/main/java/com/dennis/automix/audio/FourStemIntelligence.java             app/src/main/java/com/dennis/automix/audio/MultiStemIntelligence.java             app/src/main/java/com/dennis/automix/audio/ZipStemImporter.java             tests/AutoMixEngineTest.java tests/ZipStemImporterTest.java | tee /tmp/trusted-diff
          test ! -s /tmp/trusted-diff
      - name: Test existing 2-to-12 stem engine and new stereo premaster
        run: |
          mkdir -p host-classes
          javac -encoding UTF-8 -d host-classes             app/src/main/java/com/dennis/automix/audio/AutoMixEngine.java             app/src/main/java/com/dennis/automix/audio/FourStemIntelligence.java             app/src/main/java/com/dennis/automix/audio/MultiStemIntelligence.java             app/src/main/java/com/dennis/automix/audio/ZipStemImporter.java             app/src/main/java/com/dennis/automix/audio/StereoPremasterEngine.java             tests/AutoMixEngineTest.java tests/ZipStemImporterTest.java             tests/StereoPremasterEngineTest.java
          java -cp host-classes AutoMixEngineTest
          java -cp host-classes ZipStemImporterTest
          java -cp host-classes StereoPremasterEngineTest
      - name: Compile offline Android APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Validate package and source
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -tq app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.dennis.automix.stereopremaster024'"
          cp app/build/outputs/apk/debug/app-debug.apk Dennis-AutoMix-v0.2.4-Stereo-Premaster-TEST.apk
          zip -qr Dennis-AutoMix-v0.2.4-Stereo-Premaster-Source.zip . -x '.git/*' '.gradle/*' 'host-classes/*' 'app/build/*' '*.apk'
          sha256sum Dennis-AutoMix-v0.2.4-Stereo-Premaster-TEST.apk Dennis-AutoMix-v0.2.4-Stereo-Premaster-Source.zip > SHA256SUMS.txt
      - name: Upload independent test APK and source
        uses: actions/upload-artifact@v4
        with:
          name: AutoMix-v0.2.4-Stereo-Premaster-Test
          path: |
            Dennis-AutoMix-v0.2.4-Stereo-Premaster-TEST.apk
            Dennis-AutoMix-v0.2.4-Stereo-Premaster-Source.zip
            SHA256SUMS.txt
          retention-days: 30
