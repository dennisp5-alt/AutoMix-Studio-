name: AutoMix Studio v0.1.0 — Android APK + DSP regression
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Host DSP regression
        run: |
          mkdir -p host-classes
          javac -encoding UTF-8 -d host-classes app/src/main/java/com/dennis/automix/audio/AutoMixEngine.java tests/AutoMixEngineTest.java
          java -cp host-classes AutoMixEngineTest
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: unzip -tq app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dennis-AutoMix-Studio-v0.1.0-TEST-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
